<html manifest="cache.appcache">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>perrunoGT</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    rgba(0, 255, 120, 0.08),
                    transparent 45%
                ),
                #020604;

            color: #d9ffe9;

            font: 15px/1.5 monospace;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* GRID DE FONDO */

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(0,255,120,0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0,255,120,0.035) 1px,
                    transparent 1px
                );

            background-size: 35px 35px;

            pointer-events: none;
        }

        /* BRILLO */

        body::after {
            content: "";
            position: fixed;

            width: 420px;
            height: 420px;

            background: rgba(0,255,120,0.035);

            filter: blur(90px);

            pointer-events: none;
        }

        /* PANEL */

        #console {
            position: relative;

            width: min(88vw, 720px);
            max-height: 70vh;

            padding: 28px 30px;

            overflow-y: auto;

            white-space: pre-wrap;

            font-family: monospace;
            font-size: 14px;
            line-height: 1.8;

            background: rgba(2, 12, 7, 0.94);

            border: 1px solid rgba(0,255,120,0.25);

            border-radius: 18px;

            box-shadow:
                0 0 50px rgba(0,255,120,0.07),
                0 25px 80px rgba(0,0,0,0.7),
                inset 0 0 35px rgba(0,255,120,0.025);

            text-align: left;

            z-index: 2;
        }

        /* CABECERA VISUAL */

        body::marker {
            display: none;
        }

        .ok {
            color: #00ff88;

            text-shadow:
                0 0 8px rgba(0,255,136,0.5);
        }

        .bad {
            color: #ff405d;

            text-shadow:
                0 0 8px rgba(255,64,93,0.4);
        }

        .warn {
            color: #b8ff52;

            text-shadow:
                0 0 8px rgba(184,255,82,0.35);
        }

        /* LINEA SUPERIOR DEL PANEL */

        #console::before {
            content: "PERRUNOGT // PS4 HOST";
            display: block;

            margin-bottom: 18px;
            padding-bottom: 12px;

            color: #00ff88;

            font-size: 13px;
            font-weight: bold;

            letter-spacing: 0.16em;

            border-bottom: 1px solid rgba(0,255,136,0.16);

            text-shadow:
                0 0 10px rgba(0,255,136,0.5);
        }

        /* LOGS */

        #console {
            scrollbar-width: thin;
            scrollbar-color: #00b968 transparent;
        }

        #console::-webkit-scrollbar {
            width: 5px;
        }

        #console::-webkit-scrollbar-track {
            background: transparent;
        }

        #console::-webkit-scrollbar-thumb {
            background: #00b968;
            border-radius: 10px;
        }

        /* BARRA DE ESCANEO */

        body > #console::after {
            content: "";

            position: fixed;

            left: 0;
            right: 0;

            height: 1px;

            background: rgba(0,255,136,0.18);

            box-shadow:
                0 0 10px rgba(0,255,136,0.3);

            animation: scan 4s linear infinite;

            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: 0;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        /* PANTALLAS PEQUEÑAS */

        @media (max-width: 600px) {
            #console {
                width: 92vw;
                padding: 22px;

                font-size: 12px;
                line-height: 1.7;
            }

            #console::before {
                font-size: 11px;
            }
        }
    </style>

    <script>
    if (window.applicationCache && window.applicationCache.status == 0) {
        window.location.replace("cache.html");
    }
    </script>
</head>

<body>

    <pre id="console"></pre>

</body>

<script>
(function () {
    var con = document.getElementById("console");

    function print(msg, cls) {
        var span = document.createElement("span");
        if (cls) span.className = cls;
        span.textContent = msg + "\n";
        con.appendChild(span);
    }

    var params = new URLSearchParams(location.search);

    // Firmwares with measured kernel table — KEEP IN SYNC with ps4_offsets.js
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced    = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);

    print("firmware: " + (key || "unknown"));
    print("supported: " + (supported ? "yes" : "no"), supported ? "ok" : "bad");

    var target = "jb.html" + location.search;

    function go() {
        print("loading exploit...", "warn");
        location.replace(target);
    }

    function waitForTap(msg, action) {
        print(msg, "warn");
        function fire() {
            window.removeEventListener("click",   fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click",   fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        print("UNSUPPORTED FIRMWARE — tap / press X to run anyway", "bad");
        waitForTap("", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        print("offline — running from cache", "ok");
        go();
    } else if (ac.status === ac.IDLE) {
        print("cached", "ok");
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        print("update downloaded", "ok");
        waitForTap("UPDATE READY — tap / press X to reload", function () { location.reload(); });
    } else {
        print("checking cache...");
        ac.addEventListener("downloading",
            function () { print("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                print("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            print("cached for offline use", "ok");
            waitForTap("CACHED — tap / press X to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            print("update downloaded", "ok");
            waitForTap("UPDATE READY — tap / press X to reload",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            print("cached — offline ready", "ok");
            go();
        }, false);
        ac.addEventListener("error", function () {
            print("cache unavailable");
            waitForTap("CACHE FAILED — tap / press X to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            print("cache obsolete");
            waitForTap("CACHE OBSOLETE — tap / press X to run", go);
        }, false);
    }
})();
</script>
</html>
