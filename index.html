<html manifest="cache.appcache">
<head>
<title>perrunoGT · PS4 Exploit</title>

<style>
html, body {
    width: 100%;
    height: 100%;
}

body {
    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(0, 255, 136, 0.08),
            transparent 45%
        ),
        #020604;

    color: #dfffea;
    font-size: 20px;
    text-align: center;
    margin: 0;
    overflow: hidden;

    font-family: monospace;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* Fondo de cuadrícula */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(0, 255, 136, 0.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0, 255, 136, 0.025) 1px,
            transparent 1px
        );

    background-size: 40px 40px;
    pointer-events: none;
}

/* Panel principal */

.info {
    position: absolute;
    top: 50%;
    left: 50%;

    width: min(82vw, 620px);

    padding: 32px 28px;

    font-size: 20px;
    font-family: monospace;

    color: #00ff88;

    transform: translate(-50%, -50%);

    background: rgba(2, 12, 7, 0.94);

    border: 1px solid rgba(0, 255, 136, 0.3);
    border-radius: 18px;

    box-shadow:
        0 0 60px rgba(0, 255, 136, 0.08),
        0 25px 80px rgba(0, 0, 0, 0.7),
        inset 0 0 30px rgba(0, 255, 136, 0.025);

    text-shadow:
        0 0 10px rgba(0, 255, 136, 0.5);

    box-sizing: border-box;
}

/* Encabezado */

.info::before {
    content: "PERRUNOGT // PS4 HOST";

    display: block;

    margin-bottom: 24px;
    padding-bottom: 12px;

    color: #00ff88;

    font-size: 13px;
    font-weight: bold;

    letter-spacing: 0.15em;

    border-bottom: 1px solid rgba(0, 255, 136, 0.2);

    text-shadow:
        0 0 12px rgba(0, 255, 136, 0.55);
}

/* Línea decorativa */

.info::after {
    content: "";
    display: block;

    width: 70%;
    height: 2px;

    margin: 24px auto 0;

    background: #00ff88;

    box-shadow:
        0 0 12px rgba(0, 255, 136, 0.6);

    animation: glow 1.5s ease-in-out infinite alternate;
}

@keyframes glow {
    from {
        opacity: 0.35;
        transform: scaleX(0.75);
    }

    to {
        opacity: 1;
        transform: scaleX(1);
    }
}

/* Línea de escaneo */

body::after {
    content: "";

    position: fixed;

    left: 0;
    right: 0;

    height: 1px;

    background: rgba(0, 255, 136, 0.15);

    box-shadow:
        0 0 10px rgba(0, 255, 136, 0.3);

    animation: scan 5s linear infinite;

    pointer-events: none;
}

@keyframes scan {
    0% {
        top: 0;
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    90% {
        opacity: 1;
    }

    100% {
        top: 100%;
        opacity: 0;
    }
}

@media (max-width: 600px) {
    .info {
        width: 88vw;
        padding: 25px 18px;
        font-size: 16px;
    }

    .info::before {
        font-size: 11px;
    }
}
</style>

<script>
history.replaceState(null, null, 'index.html');
var histlength = history.length;
history.go(-histlength);

function DLProgress(e) {
    var pct = Math.round(e.loaded / e.total * 100);
    msgs.innerHTML = "perrunoGT &middot; Installing ... " + pct + "%";
}

function DisplayCacheProgress() {
    setTimeout(function () {
        msgs.innerHTML = "perrunoGT &middot; Cache OK";
    }, 2000);
    setTimeout(function () {
        location.reload();
    }, 3000);
}

window.applicationCache.addEventListener("progress",    DLProgress,           false);
window.applicationCache.oncached     = function (e) { DisplayCacheProgress(); };
window.applicationCache.onupdateready = function (e) { DisplayCacheProgress(); };
</script>

</head>

<body>
<div id="msgs" class="info"></div>
</body>
</html>
